    description: Power AI agents that discover and execute tools at runtime within an isolated session.
- aid: composio:tools-api
  name: Composio Tools API
  description: Enables listing, searching, and executing individual actions within toolkits. The Tools API allows developers
    to discover available tools, filter by toolkit or capability, and execute specific actions on behalf of connected users.
