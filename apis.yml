- aid: composio:mcp-api
  name: Composio MCP API
  description: Exposes Composio's toolkits over the Model Context Protocol so MCP-compatible clients (Claude Desktop, Cursor,
    and other MCP hosts) can discover and execute Composio tools through a managed gateway with delegated auth and scoped
    sessions.
  humanURL: https://docs.composio.dev/reference
  baseURL: https://backend.composio.dev/api/v3
  tags:
  - MCP
  - Gateway
  - AI Agents
  - Tools
