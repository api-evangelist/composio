aid: composio
name: Composio
description: Composio is an agent execution platform that bridges AI decision-making and real-world action across 1000+ apps
  through just-in-time tool calls, secure delegated auth, sandboxed environments, an MCP gateway, parallel execution, and
  context-aware sessions. Developers get managed OAuth, a tool router for runtime tool discovery, webhook triggers, and a
  CLI so agents turn intent into action without custom integration work.
type: Index
position: Consumer
access: 3rd-Party
