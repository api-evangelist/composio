specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Composio
providerId: composio
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-15'
reconciled: true
tags:
  - AI Agents
  - Authentication
  - Integrations
  - OAuth
  - Tools
  - Unified_API
  - Rate Limiting
description: Composio enforces tier-based monthly tool-call quotas (Free 20K, Starter 200K, Professional
  2M, Enterprise custom) per the public pricing page. Per-second / per-minute throttling values are not
  publicly published; consumers should expect 429 responses with Retry-After when steady-state limits
  are exceeded. Enterprise limits are negotiated.
sources:
  - https://composio.dev/pricing
  - https://docs.composio.dev/
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - name: Hobby Tier Monthly Quota
    scope: account
    metric: tool_calls_per_month
    limit: 20000
    timeFrame: month
    notes: Free tier monthly tool-call ceiling. Excess calls are blocked rather than billed.
  - name: Starter Tier Monthly Quota
    scope: account
    metric: tool_calls_per_month
    limit: 200000
    timeFrame: month
    notes: Included quota; overage billed at $0.299 per 1K calls.
  - name: Professional Tier Monthly Quota
    scope: account
    metric: tool_calls_per_month
    limit: 2000000
    timeFrame: month
    notes: Included quota; overage billed at $0.249 per 1K calls.
  - name: Enterprise Tier Monthly Quota
    scope: contract
    metric: tool_calls_per_month
    limit: 'see contract'
    notes: Custom-negotiated volume.
  - name: Per-Account Throttling
    scope: account
    metric: requests_per_10_minutes
    limit: '20000 to 100000 depending on plan'
    notes: Composio docs reference per-account throttling in the range of 20K to 100K requests per 10 minutes
      depending on the user's plan tier. Specific per-second / per-minute envelopes are not separately
      published; consumers should expect 429 responses with Retry-After when steady-state limits are
      exceeded.
policies:
  - name: Backoff Strategy
    description: Implement exponential backoff with jitter on 429 and 503 responses; honor Retry-After
      when present.
  - name: Quota Reset
    description: Monthly tool-call quotas reset at the start of each calendar month.
  - name: Overage Billing
    description: On Starter and Professional, calls exceeding the included quota are not throttled but
      billed at the tier overage rate.
  - name: Fair Use
    description: Even on enterprise contracts, sustained usage that materially impacts shared infrastructure
      may be subject to fair-use throttling.
maintainers:
