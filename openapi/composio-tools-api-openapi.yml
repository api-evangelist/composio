      responses:
        '200':
          description: Successfully executed proxy request and received response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                    description: The response data returned from the proxied API
                    example:
                      id: '123'
                      name: Resource Name
                      created_at: '2023-01-01T00:00:00Z'
                  binary_data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: URL to download binary content
                      content_type:
                        type: string
                        description: Content-Type of the binary data
                      size:
                        type: number
                        description: File size in bytes
                      expires_at:
                        type: string
                        description: ISO 8601 timestamp when the URL expires
                    required:
                    - url
                    - content_type
                    - size
                    description: Binary body response data. Present when the response is a binary file.
                  status:
                    type: number
                    description: The HTTP status code returned from the proxied API
                    example: 200
                  headers:
                    type: object
                    additionalProperties:
                      type: string
                    description: The HTTP headers returned from the proxied API
                    example:
                      content-type: application/json
                      cache-control: no-cache
                      host: api.example.com
                required:
                - status
        '400':
          description: Bad request - Invalid request parameters or body format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Authentication credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Connected account does not have permission to access the requested resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found - Resource not found or connected account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable entity - Invalid state of the connected account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests - Rate limit exceeded on the connected account or proxy service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error - Something went wrong on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented - This operation is not supported for the requested connected account or authentication scheme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Bad gateway - Error communicating with the upstream API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Gateway timeout - Upstream API timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tools:
    get:
      operationId: listTools
      summary: Composio List available tools
      description: Returns a list of available tools, optionally filtered by toolkit or search query.
      tags:
      - Tools
      parameters:
      - name: toolkit
        in: query
        schema:
          type: string
        description: Filter tools by toolkit name.
      - name: search
        in: query
        schema:
          type: string
        description: Search query to filter tools.
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
        description: Maximum number of tools to return.
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
        description: Offset for pagination.
      responses:
        '200':
          description: List of tools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolListResponse'
        '401':
          description: Unauthorized
  /tools/{toolId}/execute:
    post:
      operationId: executeTool
      summary: Composio Execute a tool action
      description: Executes a specific tool action on behalf of a connected user.
      tags:
      - Tools
      parameters:
      - name: toolId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the tool to execute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteToolRequest'
      responses:
        '200':
          description: Tool executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteToolResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Tool not found
components:
  schemas:
    ToolListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tool_2'
        totalCount:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: number
            slug:
              type: string
            status:
              type: number
            request_id:
              type: string
            suggested_fix:
              type: string
            errors:
              type: array
              items:
                type: string
          required:
          - message
          - code
          - slug
          - status
      required:
      - error
    ExecuteToolRequest:
      type: object
      required:
      - connectedAccountId
      properties:
        connectedAccountId:
          type: string
          description: The connected account to execute on behalf of.
        input:
          type: object
          description: Input parameters for the tool execution.
          additionalProperties: true
    ExecuteToolResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the execution succeeded.
        output:
          description: The output from the tool execution.
        error:
          type: string
          description: Error message if execution failed.
    Tool_2:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the tool.
        name:
          type: string
          description: Human-readable name of the tool.
        description:
          type: string
          description: Description of the tool's functionality.
        toolkit:
          type: string
          description: The toolkit this tool belongs to.
        parameters:
          type: object
          description: JSON Schema for the tool's input parameters.
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
    Tool:
      type: object
      properties:
        slug:
          type: string
          description: Unique identifier for the tool
          example: GITHUB_CREATE_A_WORKFLOW_DISPATCH_EVENT
        name:
          type: string
          description: Human-readable display name of the tool
          example: GitHub Actions
        description:
          type: string
          description: Detailed explanation of the tool's functionality and purpose
          example: Automate GitHub workflows including CI/CD, issue management, and release processes
        toolkit:
          type: object
          properties:
            slug:
              type: string
              description: Unique identifier of the parent toolkit
              example: github
            name:
              type: string
              description: Human-readable name of the parent toolkit
              example: GitHub
            logo:
              type: string
              description: URL to the toolkit logo image
              example: https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png
          required:
          - slug
          - name
          - logo
        input_parameters:
          type: object
          additionalProperties:
            nullable: true
          description: Schema definition of required input parameters for the tool
          example:
            repo_name:
              type: string
              description: GitHub repository name in owner/repo format
              required: true
              example: octocat/Hello-World
            workflow_id:
              type: string
              description: ID or filename of the workflow to trigger
              required: true
              example: main.yml
        no_auth:
          type: boolean
          description: Indicates if the tool can be used without authentication
          example: false
        available_versions:
          type: array
          items:
            type: string
          description: List of all available versions for this tool
          example:
          - '20250905_00'
          - '20250906_00'
        version:
          type: string
          description: Current version of the tool
          example: '20250905_00'
        output_parameters:
          type: object
          additionalProperties:
            nullable: true
          description: Schema definition of return values from the tool
          example:
            run_id:
              type: number
              description: ID of the workflow run that was triggered
              example: 12345678
            status:
              type: string
              description: Status of the workflow run
              example: completed
              enum:
              - queued
              - in_progress
              - completed
              - failed
        scopes:
          type: array
          items:
            type: string
          description: List of scopes associated with the tool
          example:
          - https://www.googleapis.com/auth/gmail.modify
        scope_requirements:
          type: object
          nullable: true
          properties:
            all_of:
              type: array
              items:
                anyOf:
                - type: string
                - type: object
                  properties:
                    any_of:
                      type: array
                      items:
                        type: string
                      minItems: 1
                  required:
                  - any_of
          required:
          - all_of
          description: Structured scope requirements for the tool. Null means the tool is legacy and only exposes flat scopes.
          example:
            all_of:
            - read:user
            - any_of:
              - repo
              - public_repo
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the tool for categorization and filtering
          example:
          - ci-cd
          - github
          - automation
          - devops
        human_description:
          type: string
          description: Human-friendly description of the tool, if available
          example: Create a new issue in a GitHub repository
        is_deprecated:
          type: boolean
          description: Indicates if this tool is deprecated and may be removed in the future
          example: false
        deprecated:
          type: object
          properties:
            displayName:
              type: string
              description: The display name of the tool
              example: GitHub Actions
            version:
              type: string
              description: Current version identifier of the tool
              example: '20250905_00'
            available_versions:
              type: array
              items:
                type: string
              description: List of all available versions for this tool
              example:
              - '20250905_00'
              - '20250906_00'
            is_deprecated:
              type: boolean
              description: Indicates if this tool is deprecated and may be removed in the future
              example: false
            toolkit:
              type: object
              properties:
                logo:
                  type: string
                  description: URL to the toolkit logo image
                  example: https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png
              required:
              - logo
          required:
          - displayName
          - version
          - available_versions
          - is_deprecated
          - toolkit
      required:
      - slug
      - name
      - description
      - toolkit
      - input_parameters
      - no_auth
      - available_versions
      - version
      - output_parameters
      - scopes
      - scope_requirements
      - tags
      - is_deprecated
      - deprecated
    ToolsPaginated:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        next_cursor:
          type: string
          nullable: true
        total_pages:
          type: number
        current_page:
          type: number
        total_items:
          type: number
      required:
      - items
      - total_pages
      - current_page
      - total_items
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Project API key authentication
    UserApiKeyAuth:
      type: apiKey
      in: header
      name: x-user-api-key
      description: User API key authentication
    CookieAuth:
      type: apiKey
      in: cookie
      name: authToken
      description: Cookie-based session authentication
    OrgApiKeyAuth:
      type: apiKey
      in: header
      name: x-org-api-key
      description: Organization API key authentication
