                        description: Manage connections configuration
                      tools:
                        type: object
                        additionalProperties:
                          anyOf:
                          - type: object
                            properties:
                              enabled:
                                type: array
                                items:
                                  type: string
                            required:
                            - enabled
                            additionalProperties: false
                          - type: object
                            properties:
                              disabled:
                                type: array
                                items:
                                  type: string
                            required:
                            - disabled
                            additionalProperties: false
                          - type: object
                            properties:
                              tags:
                                type: object
                                properties:
                                  enabled:
                                    type: array
                                    items:
                                      type: string
                                      enum:
                                      - readOnlyHint
                                      - destructiveHint
                                      - idempotentHint
                                      - openWorldHint
                                    description: Tags that the tool must have at least one of
                                  disabled:
                                    type: array
                                    items:
                                      type: string
                                      enum:
                                      - readOnlyHint
                                      - destructiveHint
                                      - idempotentHint
                                      - openWorldHint
                                    description: Tags that the tool must NOT have any of
                            required:
                            - tags
                            additionalProperties: false
                        description: Tool-level configuration per toolkit
                      tags:
