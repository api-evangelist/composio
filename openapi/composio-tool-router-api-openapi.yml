                        - http
                        description: The type of the MCP server. Can be http
                      url:
                        type: string
                        format: uri
                        description: The URL of the MCP server
                        example: https://app.composio.dev/tool_router/v3/trs_1a2b3c4d5e6f/mcp
                    required:
