            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v3/tool_router/session/{session_id}/mounts/{mount_id}/upload_url:
    post:
      summary: Create a presigned upload URL for a mount file
      description: Generates a presigned upload URL for uploading a file to a workbench session mount. The caller should PUT the file content directly to the returned URL.
      tags:
      - Tool Router
      operationId: postToolRouterSessionBySessionIdMountsByMountIdUploadUrl
      security:
      - ApiKeyAuth: []
      - UserApiKeyAuth: []
      - CookieAuth: []
      parameters:
      - schema:
          type: string
          format: toolRouterSessionId
          description: The unique identifier of the tool router session
          example: trs_1a2b3c4d5e6f
        required: true
        description: The unique identifier of the tool router session
        name: session_id
        in: path
      - schema:
          type: string
          minLength: 1
          description: ID of the storage mount
          example: files
        required: true
        description: ID of the storage mount
        name: mount_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mount_relative_path:
                  type: string
                  minLength: 1
                  description: Supports subdirectories (e.g. "data/output.csv", "images/charts/chart.png")
                  example: report.pdf
                mimetype:
                  type: string
                  minLength: 1
                  description: MIME type of the file being uploaded
                  example: application/pdf
              required:
              - mount_relative_path
      responses:
        '201':
          description: Upload URL created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                    description: Presigned upload URL — PUT the file content here
                  mount_relative_path:
                    type: string
                    description: Relative file path within the mount (e.g. "report.pdf")
                  sandbox_mount_prefix:
                    type: string
                    description: Absolute mount path inside the sandbox (e.g. /mnt/files)
                  expires_at:
                    type: string
                    description: ISO 8601 timestamp when the upload URL expires
                required:
                - upload_url
                - mount_relative_path
                - sandbox_mount_prefix
                - expires_at
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session or mount not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v3/tool_router/session/{session_id}/mounts/{mount_id}/delete:
    post:
      summary: Delete a file from a session mount
      description: Deletes a file from a workbench session storage mount. S3 delete is idempotent — deleting a non-existent file succeeds silently.
      tags:
      - Tool Router
      operationId: postToolRouterSessionBySessionIdMountsByMountIdDelete
      security:
      - ApiKeyAuth: []
      - UserApiKeyAuth: []
      - CookieAuth: []
      parameters:
      - schema:
          type: string
          format: toolRouterSessionId
          description: The unique identifier of the tool router session
          example: trs_1a2b3c4d5e6f
        required: true
        description: The unique identifier of the tool router session
        name: session_id
        in: path
      - schema:
          type: string
          minLength: 1
          description: ID of the storage mount
          example: files
        required: true
        description: ID of the storage mount
        name: mount_id
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mount_relative_path:
                  type: string
                  minLength: 1
                  description: Relative file path within the mount
                  example: report.pdf
              required:
              - mount_relative_path
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  mount_relative_path:
                    type: string
                    description: Relative file path that was deleted
                  sandbox_mount_prefix:
                    type: string
                    description: Absolute mount path inside the sandbox (e.g. /mnt/files)
                required:
                - mount_relative_path
                - sandbox_mount_prefix
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session or mount not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /toolRouter/session:
    post:
      operationId: createSession
      summary: Composio Create a tool router session
      description: Creates a new session for an AI agent to discover and execute tools.
      tags:
      - Tool Router
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectedAccountId:
                  type: string
                  description: The connected account to use for this session.
      responses:
        '200':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Unauthorized
components:
  schemas:
    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: Unique identifier for the session.
        status:
          type: string
          description: Session status.
    Tool:
      type: object
      properties:
        slug:
          type: string
          description: Unique identifier for the tool
          example: GITHUB_CREATE_A_WORKFLOW_DISPATCH_EVENT
        name:
          type: string
          description: Human-readable display name of the tool
          example: GitHub Actions
        description:
          type: string
          description: Detailed explanation of the tool's functionality and purpose
          example: Automate GitHub workflows including CI/CD, issue management, and release processes
        toolkit:
          type: object
          properties:
            slug:
              type: string
              description: Unique identifier of the parent toolkit
              example: github
            name:
              type: string
              description: Human-readable name of the parent toolkit
              example: GitHub
            logo:
              type: string
              description: URL to the toolkit logo image
              example: https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png
          required:
          - slug
          - name
          - logo
        input_parameters:
          type: object
          additionalProperties:
            nullable: true
          description: Schema definition of required input parameters for the tool
          example:
            repo_name:
              type: string
              description: GitHub repository name in owner/repo format
              required: true
              example: octocat/Hello-World
            workflow_id:
              type: string
              description: ID or filename of the workflow to trigger
              required: true
              example: main.yml
        no_auth:
          type: boolean
          description: Indicates if the tool can be used without authentication
          example: false
        available_versions:
          type: array
          items:
            type: string
          description: List of all available versions for this tool
          example:
          - '20250905_00'
          - '20250906_00'
        version:
          type: string
          description: Current version of the tool
          example: '20250905_00'
        output_parameters:
          type: object
          additionalProperties:
            nullable: true
          description: Schema definition of return values from the tool
          example:
            run_id:
              type: number
              description: ID of the workflow run that was triggered
              example: 12345678
            status:
              type: string
              description: Status of the workflow run
              example: completed
              enum:
              - queued
              - in_progress
              - completed
              - failed
        scopes:
          type: array
          items:
            type: string
          description: List of scopes associated with the tool
          example:
          - https://www.googleapis.com/auth/gmail.modify
        scope_requirements:
          type: object
          nullable: true
          properties:
            all_of:
              type: array
              items:
                anyOf:
                - type: string
                - type: object
                  properties:
                    any_of:
                      type: array
                      items:
                        type: string
                      minItems: 1
                  required:
                  - any_of
          required:
          - all_of
          description: Structured scope requirements for the tool. Null means the tool is legacy and only exposes flat scopes.
          example:
            all_of:
            - read:user
            - any_of:
              - repo
              - public_repo
        tags:
          type: array
          items:
            type: string
          description: List of tags associated with the tool for categorization and filtering
          example:
          - ci-cd
          - github
          - automation
          - devops
        human_description:
          type: string
          description: Human-friendly description of the tool, if available
          example: Create a new issue in a GitHub repository
        is_deprecated:
          type: boolean
          description: Indicates if this tool is deprecated and may be removed in the future
          example: false
        deprecated:
          type: object
          properties:
            displayName:
              type: string
              description: The display name of the tool
              example: GitHub Actions
            version:
              type: string
              description: Current version identifier of the tool
              example: '20250905_00'
            available_versions:
              type: array
              items:
                type: string
              description: List of all available versions for this tool
              example:
              - '20250905_00'
              - '20250906_00'
            is_deprecated:
              type: boolean
              description: Indicates if this tool is deprecated and may be removed in the future
              example: false
            toolkit:
              type: object
              properties:
                logo:
                  type: string
                  description: URL to the toolkit logo image
                  example: https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png
              required:
              - logo
          required:
          - displayName
          - version
          - available_versions
          - is_deprecated
          - toolkit
      required:
      - slug
      - name
      - description
      - toolkit
      - input_parameters
      - no_auth
      - available_versions
      - version
      - output_parameters
      - scopes
      - scope_requirements
      - tags
      - is_deprecated
      - deprecated
    ToolRouterToolkitsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Display name of the toolkit
              slug:
                type: string
                description: Unique slug identifier
              enabled:
                type: boolean
                description: Whether the toolkit is enabled
              is_no_auth:
                type: boolean
                description: Whether the toolkit is no-auth
              composio_managed_auth_schemes:
                type: array
                items:
                  type: string
                description: Available Composio-managed auth schemes
              meta:
                type: object
                properties:
                  logo:
                    type: string
                    format: uri
                    description: URL to the toolkit logo
                  description:
                    type: string
                    description: Description of the toolkit
                required:
                - logo
                - description
                description: Toolkit metadata
              connected_account:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                    format: connectedAccountId
                    description: Connected account identifier
                  user_id:
                    type: string
                    description: User identifier
                  status:
                    type: string
                    description: Connection status
                  created_at:
                    type: string
                    format: date-time
                    description: Creation timestamp
                  auth_config:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Auth config identifier
                      auth_scheme:
                        type: string
                        description: Authentication scheme type
                      is_composio_managed:
                        type: boolean
                        description: Whether this is a Composio-managed auth config
                    required:
                    - id
                    - auth_scheme
                    - is_composio_managed
                    description: Auth config details
                required:
                - id
                - user_id
                - status
                - created_at
                - auth_config
                description: Connected account if available
            required:
            - name
            - slug
            - enabled
            - is_no_auth
            - composio_managed_auth_schemes
            - meta
            - connected_account
        next_cursor:
          type: string
          nullable: true
        total_pages:
          type: number
        current_page:
          type: number
        total_items:
          type: number
      required:
      - items
      - total_pages
      - current_page
      - total_items
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            code:
              type: number
            slug:
              type: string
            status:
              type: number
            request_id:
              type: string
            suggested_fix:
              type: string
            errors:
              type: array
              items:
                type: string
          required:
          - message
          - code
          - slug
          - status
      required:
      - error
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Project API key authentication
    UserApiKeyAuth:
      type: apiKey
      in: header
      name: x-user-api-key
      description: User API key authentication
    CookieAuth:
      type: apiKey
      in: cookie
      name: authToken
      description: Cookie-based session authentication
    OrgApiKeyAuth:
      type: apiKey
      in: header
      name: x-org-api-key
      description: Organization API key authentication
