# Vendor facets — Composio. An agent-integration platform that builds 1,500+ toolkits ABOUT
# third-party APIs and serves them as MCP at backend.composio.dev/v3/mcp/<id>, with Composio-managed
# auth. The provider is not involved in writing or hosting those tools, so they earn the provider
# nothing unless it declares the Composio URL itself — and then only `platform` (0.25).
vendor: composio
name: Composio
website: https://composio.dev
areas:
- mcp-hosting
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Composio's toolkits are written and hosted by Composio for its developer customers, not for the API
  providers they wrap: a Composio toolkit for your API earns your Kin Score nothing. If a provider chose
  to declare a Composio-hosted MCP URL as its server, 0.22.0 would grade it `platform` (0.25 of 12 agent-readiness
  points) — a shared tool shape on backend.composio.dev. Composio's Agent Skill, llms.txt, CLI and SDKs
  describe Composio, not the provider.
features:
- id: toolkits
  name: 1,500+ prebuilt toolkits
  description: >-
    Composio-built tool definitions for third-party apps, with tool discovery and execution through sessions.
  source: https://docs.composio.dev/llms.txt
  tier: all
- id: single-toolkit-mcp
  name: Single-toolkit MCP servers
  description: >-
    MCP configs scoped to one toolkit, served at https://backend.composio.dev/v3/mcp/<server-id>?user_id=<user>.
  source: https://docs.composio.dev/docs/single-toolkit-mcp.md
  tier: all
- id: sessions-mcp
  name: Sessions via hosted MCP
  description: Exposes an application-created Composio session through a hosted MCP endpoint on Composio's
    backend.
  source: https://docs.composio.dev/docs/sessions-via-mcp.md
  tier: all
- id: managed-auth
  name: Managed auth configs and white-label OAuth
  description: >-
    Composio-managed OAuth apps by default, or the developer's own OAuth app with Composio branding removed.
  source: https://docs.composio.dev/docs/authentication.md
  tier: all
- id: custom-tools
  name: Custom tools and toolkits
  description: Developers define local tools that run in-process alongside remote Composio tools.
  source: https://docs.composio.dev/llms-index.txt
  tier: all
- id: composio-skill
  name: Composio Agent Skill
  description: An official Agent Skill (ComposioHQ/composio) that teaches coding agents to set up Composio.
  source: https://docs.composio.dev/llms.txt
  tier: open-source
maps:
- feature: single-toolkit-mcp
  check: mcp_server
  layer: agent_readiness
  grade: platform
  credit: 0.25
  conditional: true
  condition: >-
    Only if the provider itself declares the Composio-hosted MCP URL in its own mcp/ manifest. Composio
    publishing a toolkit about the API, without the provider, puts nothing in the provider's repo and
    earns nothing.
  provider_must: >-
    Declare the backend.composio.dev MCP URL as its server; it is still read as a vendor-domain, shared-shape
    server.
  note: >-
    The tool shape is Composio's across every toolkit and the host is Composio's; 0.22.0 grades that `platform`.
  points: 12
  baseline_pass_rate: 0.22
earns_nothing:
- feature: toolkits
  check: mcp_server
  why: >-
    A toolkit Composio builds about a provider's API, without the provider, is Composio's product. The
    rubric reads the provider's own mcp/ manifest; it has nothing to read.
- feature: composio-skill
  check: agent_skills
  why: >-
    The skill teaches agents to use Composio; it is not an Agent Skill for the provider's API authored
    by the provider.
- feature: managed-auth
  check: protected_resource_metadata
  why: >-
    OAuth is brokered on Composio's backend with Composio's (or the developer's) OAuth app; nothing is
    served at the provider's /.well-known/oauth-protected-resource.
- feature: managed-auth
  check: dynamic_client_registration
  why: >-
    No registration_endpoint appears in the provider's discovery document; Composio registers OAuth apps
    by hand, per toolkit.
- feature: single-toolkit-mcp
  check: mcp_endpoint_discoverable
  since: 0.23.0
  why: >-
    The endpoint is backend.composio.dev/v3/mcp/<server-id>?user_id=<user>, created per developer config;
    nothing public fills in the server id, which grades `templated` (0.0).
- feature: custom-tools
  check: agent_skill_present
  why: >-
    Custom tools are code in the developer's app; they are not a published artifact on the provider's
    surface.
out_of_reach:
  checks:
  - contract_present
  - spec_presence
  - llms_txt_published
  - well_known_catalog
  - agent_card
  - auth_clarity
  - sdk_count_1
  - cli_present
  note: >-
    Composio consumes APIs rather than publishing for them; its SDKs, CLI and llms.txt are its own and
    no check on the provider moves when Composio adds a toolkit.
surface:
  agent_readiness:
    reachable: 3.0
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
method: searched
source:
- https://docs.composio.dev/docs/authentication.md
- https://docs.composio.dev/docs/sessions-via-mcp.md
- https://docs.composio.dev/docs/single-toolkit-mcp.md
- https://docs.composio.dev/llms-index.txt
- https://docs.composio.dev/llms.txt
