specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Composio
providerId: composio
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - AI Agents
  - Authentication
  - Integrations
  - OAuth
  - Tools
  - Unified_API
description: Composio prices on a tiered subscription model around tool-call volume. Each tier includes
  a monthly quota of tool calls; usage above quota is billed per 1,000 calls at a tier-specific overage
  rate. Enterprise is custom-quoted with VPC/on-prem and SOC-2 options.
sources:
  - https://composio.dev/pricing
plans:
  - id: composio-free
    name: Hobby
    type: freemium
    description: Free entry tier with 20K tool calls per month and community support.
    entries:
      - label: Tool Calls
        description: Included monthly tool-call quota
        name: tool_calls
        type: quota
        metric: tool_calls
        limit: 20000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Community Support
      - name: Public Documentation
      - name: Composio Tool Router API
      - name: Composio Tools API
      - name: Composio Connected Accounts API
      - name: Composio Auth Configs API
      - name: Composio Triggers API
      - name: Composio Toolkits API
  - id: composio-starter
    name: Starter
    type: subscription
    description: Entry paid tier at $29/month with 200K tool calls included and email support.
    entries:
      - label: Subscription
        description: Monthly base subscription
        name: subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: '$29'
        userMultiplied: false
      - label: Tool Calls
        description: Included monthly tool-call quota
        name: tool_calls
        type: quota
        metric: tool_calls
        limit: 200000
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Overage
        description: Per-1K tool-call price after monthly quota is exceeded
        name: overage
        type: metered
        metric: tool_calls
        limit: -1
        timeFrame: month
        geo: global
        unit: 1000
        price: '$0.299'
        userMultiplied: false
    elements:
      - name: Email Support
      - name: Composio Tool Router API
      - name: Composio Tools API
      - name: Composio Connected Accounts API
      - name: Composio Auth Configs API
      - name: Composio Triggers API
      - name: Composio Toolkits API
  - id: composio-professional
    name: Professional
    type: subscription
    description: Production tier at $229/month with 2M tool calls included and Slack support for 1K+/month
      consumers.
    entries:
      - label: Subscription
        description: Monthly base subscription
        name: subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: '$229'
        userMultiplied: false
      - label: Tool Calls
        description: Included monthly tool-call quota
        name: tool_calls
        type: quota
        metric: tool_calls
        limit: 2000000
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Overage
        description: Per-1K tool-call price after monthly quota is exceeded
        name: overage
        type: metered
        metric: tool_calls
        limit: -1
        timeFrame: month
        geo: global
        unit: 1000
        price: '$0.249'
        userMultiplied: false
    elements:
      - name: Slack Support
      - name: Composio Tool Router API
      - name: Composio Tools API
      - name: Composio Connected Accounts API
      - name: Composio Auth Configs API
      - name: Composio Triggers API
      - name: Composio Toolkits API
  - id: composio-enterprise
    name: Enterprise
    type: enterprise
    description: Custom-quoted tier with adjustable API volume, dedicated SLA, SOC-2 compliance, and VPC
      or on-premises deployment options.
    entries:
      - label: Subscription
        description: Custom-negotiated subscription
        name: subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: configurable
        unit: 1
        price: custom
        userMultiplied: false
      - label: Tool Calls
        description: Negotiated tool-call volume
        name: tool_calls
        type: quota
        metric: tool_calls
        limit: -1
        timeFrame: month
        geo: configurable
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Custom User Accounts
      - name: Dedicated SLA
      - name: SOC-2 Compliance
      - name: VPC / On-Premises Deployment
      - name: Composio Tool Router API
      - name: Composio Tools API
      - name: Composio Connected Accounts API
      - name: Composio Auth Configs API
      - name: Composio Triggers API
      - name: Composio Toolkits API
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
