naftiko: "1.0.0-alpha2"

info:
  title: Composio Triggers Subscribe
  description: >-
    Subscribes to Composio's webhook-driven Triggers (Slack message
    posted, GitHub issue opened, Notion page updated, HubSpot deal moved,
    etc.) and bridges those events into Naftiko's event-driven workflows.
    Lets a Naftiko capability declare an event source declaratively
    instead of polling.
  tags:
    - Naftiko
    - Composio
    - Partnership
    - Triggers
    - Webhooks
    - Event-Driven
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: composio-env
    description: Composio Platform API key.
    keys:
      COMPOSIO_API_KEY: COMPOSIO_API_KEY

capability:
  consumes:
    - namespace: composio
      type: http
      baseUri: https://backend.composio.dev/api/v3
      authentication:
        type: bearer
        token: '{{COMPOSIO_API_KEY}}'
      resources:
        - name: list-triggers
          path: '/triggers'
          operations:
            - name: list-triggers
              method: GET
              inputParameters:
                - { name: connected_account_id, in: query, type: string, required: false }
                - { name: toolkit, in: query, type: string, required: false }
                - { name: cursor, in: query, type: string, required: false }
            - name: subscribe-trigger
              method: POST
        - name: trigger
          path: '/triggers/{{trigger_id}}'
          operations:
            - name: get-trigger
              method: GET
              inputParameters:
                - { name: trigger_id, in: path, required: true }
            - name: unsubscribe-trigger
              method: DELETE
              inputParameters:
                - { name: trigger_id, in: path, required: true }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: composio-triggers-subscribe-rest
      description: REST surface for managing Composio Triggers (event subscriptions).
      resources:
        - name: triggers
          path: '/triggers'
          operations:
            - name: list-triggers
              method: GET
              inputParameters:
                - { name: connected_account_id, in: query, type: string, required: false }
                - { name: toolkit, in: query, type: string, required: false }
                - { name: cursor, in: query, type: string, required: false }
              call: composio.list-triggers
            - name: subscribe-trigger
              method: POST
              call: composio.subscribe-trigger
        - name: trigger
          path: '/triggers/{trigger_id}'
          operations:
            - name: get-trigger
              method: GET
              inputParameters:
                - { name: trigger_id, in: path, type: string, required: true }
              call: composio.get-trigger
            - name: unsubscribe-trigger
              method: DELETE
              inputParameters:
                - { name: trigger_id, in: path, type: string, required: true }
              call: composio.unsubscribe-trigger

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: composio-triggers-subscribe-mcp
      description: MCP server for managing Composio Triggers from agent workflows.
      tools:
        - name: list-triggers
          description: List Composio webhook trigger subscriptions (filterable by account / toolkit).
          hints: { readOnly: true }
          inputParameters:
            - { name: connected_account_id, type: string, required: false, description: Filter to a specific connected account. }
            - { name: toolkit, type: string, required: false, description: Filter to a specific toolkit. }
            - { name: cursor, type: string, required: false, description: Pagination cursor. }
          call: composio.list-triggers
        - name: subscribe-trigger
          description: Subscribe to a new Composio Trigger (webhook event).
          hints: { destructiveHint: false }
          call: composio.subscribe-trigger
        - name: get-trigger
          description: Get a single Composio Trigger by ID.
          hints: { readOnly: true }
          inputParameters:
            - { name: trigger_id, type: string, required: true, description: Composio trigger UUID. }
          call: composio.get-trigger
        - name: unsubscribe-trigger
          description: Unsubscribe from a Composio Trigger.
          hints: { destructiveHint: true }
          inputParameters:
            - { name: trigger_id, type: string, required: true, description: Composio trigger UUID. }
          call: composio.unsubscribe-trigger
