naftiko: 1.0.0-alpha2
info:
  label: Composio Platform API — URL Generation
  description: 'Composio Platform API — URL Generation. 1 operations. Lead operation: Generate MCP URL with custom parameters.
    Self-contained Naftiko capability covering one Composio business surface.'
  tags:
  - Composio
  - URL Generation
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMPOSIO_API_KEY: COMPOSIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: composio-url-generation
    baseUri: https://backend.composio.dev
    description: Composio Platform API — URL Generation business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-mcp-servers-generate
      path: /api/v3/mcp/servers/generate
      operations:
      - name: postmcpserversgenerate
        method: POST
        description: Generate MCP URL with custom parameters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.COMPOSIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: composio-url-generation-rest
    port: 8080
    description: REST adapter for Composio Platform API — URL Generation. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/mcp/servers/generate
      name: api-v3-mcp-servers-generate
      description: REST surface for api-v3-mcp-servers-generate.
      operations:
      - method: POST
        name: postmcpserversgenerate
        description: Generate MCP URL with custom parameters
        call: composio-url-generation.postmcpserversgenerate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: composio-url-generation-mcp
    port: 9090
    transport: http
    description: MCP adapter for Composio Platform API — URL Generation. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: generate-mcp-url-custom-parameters
      description: Generate MCP URL with custom parameters
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: composio-url-generation.postmcpserversgenerate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
