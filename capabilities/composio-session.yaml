naftiko: 1.0.0-alpha2
info:
  label: Composio Platform API — Session
  description: 'Composio Platform API — Session. 2 operations. Lead operation: Get current user session information. Self-contained
    Naftiko capability covering one Composio business surface.'
  tags:
  - Composio
  - Session
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMPOSIO_API_KEY: COMPOSIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: composio-session
    baseUri: https://backend.composio.dev
    description: Composio Platform API — Session business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-auth-session-info
      path: /api/v3/auth/session/info
      operations:
      - name: getauthsessioninfo
        method: GET
        description: Get current user session information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v3-auth-session-logout
      path: /api/v3/auth/session/logout
      operations:
      - name: postauthsessionlogout
        method: POST
        description: End user session and clear authentication
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.COMPOSIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: composio-session-rest
    port: 8080
    description: REST adapter for Composio Platform API — Session. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/auth/session/info
      name: api-v3-auth-session-info
      description: REST surface for api-v3-auth-session-info.
      operations:
      - method: GET
        name: getauthsessioninfo
        description: Get current user session information
        call: composio-session.getauthsessioninfo
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v3/auth/session/logout
      name: api-v3-auth-session-logout
      description: REST surface for api-v3-auth-session-logout.
      operations:
      - method: POST
        name: postauthsessionlogout
        description: End user session and clear authentication
        call: composio-session.postauthsessionlogout
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: composio-session-mcp
    port: 9090
    transport: http
    description: MCP adapter for Composio Platform API — Session. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-current-user-session-information
      description: Get current user session information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: composio-session.getauthsessioninfo
      outputParameters:
      - type: object
        mapping: $.
    - name: end-user-session-and-clear
      description: End user session and clear authentication
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: composio-session.postauthsessionlogout
      outputParameters:
      - type: object
        mapping: $.
