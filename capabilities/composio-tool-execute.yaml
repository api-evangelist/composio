naftiko: "1.0.0-alpha2"

info:
  title: Composio Tool Execute
  description: >-
    Executes any of Composio's 1000+ pre-integrated tools through the
    Composio Tools API on behalf of a connected user. Lets a Naftiko
    capability ship a Composio-tool action as a governed Naftiko
    operation — same Spectral / OPA / OTel guards apply on top of
    Composio's managed integration.
  tags:
    - Naftiko
    - Composio
    - Partnership
    - Tools
    - Execution
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: composio-env
    description: Composio Platform API key.
    keys:
      COMPOSIO_API_KEY: COMPOSIO_API_KEY

capability:
  consumes:
    - namespace: composio
      type: http
      baseUri: https://backend.composio.dev/api/v3
      authentication:
        type: bearer
        token: '{{COMPOSIO_API_KEY}}'
      resources:
        - name: list-tools
          path: '/tools'
          operations:
            - name: list-tools
              method: GET
              inputParameters:
                - { name: toolkit, in: query, type: string, required: false }
                - { name: search,  in: query, type: string, required: false }
                - { name: cursor,  in: query, type: string, required: false }
        - name: execute-tool
          path: '/tools/{{tool_id}}/execute'
          operations:
            - name: execute-tool
              method: POST
              inputParameters:
                - { name: tool_id, in: path, required: true }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: composio-tool-execute-rest
      description: REST surface for listing + executing Composio tools.
      resources:
        - name: list-tools
          path: '/tools'
          operations:
            - name: list-tools
              method: GET
              inputParameters:
                - { name: toolkit, in: query, type: string, required: false }
                - { name: search,  in: query, type: string, required: false }
                - { name: cursor,  in: query, type: string, required: false }
              call: composio.list-tools
        - name: execute-tool
          path: '/tools/{tool_id}/execute'
          operations:
            - name: execute-tool
              method: POST
              inputParameters:
                - { name: tool_id, in: path, type: string, required: true }
              call: composio.execute-tool

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: composio-tool-execute-mcp
      description: MCP server exposing Composio tool execution to AI agents.
      tools:
        - name: list-tools
          description: List or search Composio tools available across all toolkits.
          hints: { readOnly: true }
          inputParameters:
            - { name: toolkit, type: string, required: false, description: Filter to a specific toolkit. }
            - { name: search,  type: string, required: false, description: Free-text search across tools. }
            - { name: cursor,  type: string, required: false, description: Pagination cursor. }
          call: composio.list-tools
        - name: execute-tool
          description: Execute a specific Composio tool action on behalf of a connected user.
          hints: { destructiveHint: true }
          inputParameters:
            - { name: tool_id, type: string, required: true, description: Composio tool ID. }
          call: composio.execute-tool
