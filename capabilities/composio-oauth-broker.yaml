naftiko: "1.0.0-alpha2"

info:
  title: Composio OAuth Broker
  description: >-
    Routes Naftiko consume-side OAuth flows to third-party SaaS through
    Composio's managed OAuth broker (ConnectedAccount API). The Naftiko
    capability spec declares the SaaS dependency; Composio brokers the
    handshake and stores the tokens; the Naftiko engine never holds
    long-lived credentials. Solves the "where do tokens live" problem.
  tags:
    - Naftiko
    - Composio
    - Partnership
    - OAuth
    - Connected-Accounts
    - Identity
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: composio-env
    description: Composio Platform API key.
    keys:
      COMPOSIO_API_KEY: COMPOSIO_API_KEY

capability:
  consumes:
    - namespace: composio
      type: http
      baseUri: https://backend.composio.dev/api/v3
      authentication:
        type: bearer
        token: '{{COMPOSIO_API_KEY}}'
      resources:
        - name: list-connected-accounts
          path: '/connectedAccounts'
          operations:
            - name: list-connected-accounts
              method: GET
              inputParameters:
                - { name: toolkit, in: query, type: string, required: false }
                - { name: entity_id, in: query, type: string, required: false }
                - { name: cursor, in: query, type: string, required: false }
            - name: initiate-connection
              method: POST
        - name: connected-account
          path: '/connectedAccounts/{{account_id}}'
          operations:
            - name: get-connected-account
              method: GET
              inputParameters:
                - { name: account_id, in: path, required: true }
            - name: disconnect-account
              method: DELETE
              inputParameters:
                - { name: account_id, in: path, required: true }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: composio-oauth-broker-rest
      description: REST surface for brokering OAuth via Composio Connected Accounts.
      resources:
        - name: connected-accounts
          path: '/connected-accounts'
          operations:
            - name: list-connected-accounts
              method: GET
              inputParameters:
                - { name: toolkit, in: query, type: string, required: false }
                - { name: entity_id, in: query, type: string, required: false }
                - { name: cursor, in: query, type: string, required: false }
              call: composio.list-connected-accounts
            - name: initiate-connection
              method: POST
              call: composio.initiate-connection
        - name: connected-account
          path: '/connected-accounts/{account_id}'
          operations:
            - name: get-connected-account
              method: GET
              inputParameters:
                - { name: account_id, in: path, type: string, required: true }
              call: composio.get-connected-account
            - name: disconnect-account
              method: DELETE
              inputParameters:
                - { name: account_id, in: path, type: string, required: true }
              call: composio.disconnect-account

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: composio-oauth-broker-mcp
      description: MCP server for brokering OAuth connections through Composio.
      tools:
        - name: list-connected-accounts
          description: List Composio connected accounts (per toolkit / per user).
          hints: { readOnly: true }
          inputParameters:
            - { name: toolkit, type: string, required: false, description: Filter to a specific Composio toolkit. }
            - { name: entity_id, type: string, required: false, description: Filter to a specific user / entity. }
            - { name: cursor, type: string, required: false, description: Pagination cursor. }
          call: composio.list-connected-accounts
        - name: initiate-connection
          description: Initiate an OAuth handshake to a third-party SaaS via Composio.
          hints: { destructiveHint: false }
          call: composio.initiate-connection
        - name: get-connected-account
          description: Get a single Composio connected account by ID.
          hints: { readOnly: true }
          inputParameters:
            - { name: account_id, type: string, required: true, description: Composio connected-account UUID. }
          call: composio.get-connected-account
        - name: disconnect-account
          description: Disconnect / revoke a Composio connected account.
          hints: { destructiveHint: true }
          inputParameters:
            - { name: account_id, type: string, required: true, description: Composio connected-account UUID. }
          call: composio.disconnect-account
