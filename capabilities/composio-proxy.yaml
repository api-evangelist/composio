naftiko: 1.0.0-alpha2
info:
  label: Composio Platform API — Proxy
  description: 'Composio Platform API — Proxy. 1 operations. Lead operation: Execute proxy request. Self-contained Naftiko
    capability covering one Composio business surface.'
  tags:
  - Composio
  - Proxy
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMPOSIO_API_KEY: COMPOSIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: composio-proxy
    baseUri: https://backend.composio.dev
    description: Composio Platform API — Proxy business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-tools-execute-proxy
      path: /api/v3/tools/execute/proxy
      operations:
      - name: posttoolsexecuteproxy
        method: POST
        description: Execute proxy request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.COMPOSIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: composio-proxy-rest
    port: 8080
    description: REST adapter for Composio Platform API — Proxy. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v3/tools/execute/proxy
      name: api-v3-tools-execute-proxy
      description: REST surface for api-v3-tools-execute-proxy.
      operations:
      - method: POST
        name: posttoolsexecuteproxy
        description: Execute proxy request
        call: composio-proxy.posttoolsexecuteproxy
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: composio-proxy-mcp
    port: 9090
    transport: http
    description: MCP adapter for Composio Platform API — Proxy. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: execute-proxy-request
      description: Execute proxy request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: composio-proxy.posttoolsexecuteproxy
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
