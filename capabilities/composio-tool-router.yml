# Naftiko capabilities profile for Composio.
# Capabilities map verbs against the high-value operations exposed by the
# Composio v3 API. Each capability links back to the canonical OpenAPI
# definition in this repo at openapi/composio-openapi-original.yml.
provider: composio
name: Composio
description: >-
  Composio is a unified API and tooling platform for AI agents with
  1000+ pre-built connectors, managed OAuth, tool search, and a sandboxed
  workbench. These capabilities cover creating tool router sessions,
  listing and executing tools, managing connected accounts and auth
  configs, browsing toolkits, and managing triggers.
capabilities:
  - id: composio.session.create
    name: Create tool router session
    description: Create a session for an AI agent to discover and execute tools.
    api: composio:tool-router-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1toolRouter~1session/post
    inputs:
      - connectedAccountId
    outputs:
      - sessionId

  - id: composio.tools.list
    name: List tools
    description: List tools available across toolkits, with optional filters.
    api: composio:tools-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1tools/get
    inputs:
      - toolkit
      - search
      - cursor
    outputs:
      - items
      - nextCursor

  - id: composio.tools.execute
    name: Execute tool
    description: Execute a specific tool action on behalf of a connected user.
    api: composio:tools-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1tools~1{toolId}~1execute/post
    inputs:
      - toolId
      - connectedAccountId
      - arguments
    outputs:
      - status
      - output

  - id: composio.connectedAccounts.list
    name: List connected accounts
    description: List the connected accounts authorized through Composio.
    api: composio:connected-accounts-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1connectedAccounts/get
    inputs:
      - userId
      - toolkit
    outputs:
      - items

  - id: composio.connectedAccounts.create
    name: Initiate connected account
    description: Begin an OAuth flow to connect a user to a third-party application.
    api: composio:connected-accounts-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1connectedAccounts/post
    inputs:
      - userId
      - authConfigId
    outputs:
      - connectedAccountId
      - redirectUrl

  - id: composio.connectedAccounts.get
    name: Get connected account
    description: Retrieve a single connected account.
    api: composio:connected-accounts-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1connectedAccounts~1{connectedAccountId}/get
    inputs:
      - connectedAccountId
    outputs:
      - connectedAccount

  - id: composio.connectedAccounts.delete
    name: Disconnect account
    description: Remove a connected account.
    api: composio:connected-accounts-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1connectedAccounts~1{connectedAccountId}/delete
    inputs:
      - connectedAccountId
    outputs:
      - status

  - id: composio.authConfigs.list
    name: List auth configs
    description: List the auth configs that govern toolkit authentication.
    api: composio:auth-configs-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1authConfigs/get
    inputs:
      - toolkit
    outputs:
      - items

  - id: composio.triggers.list
    name: List triggers
    description: List active webhook trigger subscriptions for a project or user.
    api: composio:triggers-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1triggers/get
    inputs:
      - userId
      - toolkit
    outputs:
      - items

  - id: composio.toolkits.list
    name: List toolkits
    description: List the toolkits (third-party applications) available in Composio.
    api: composio:toolkits-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1toolkits/get
    inputs:
      - search
      - category
    outputs:
      - items

  - id: composio.toolkits.get
    name: Get toolkit
    description: Retrieve a single toolkit and its associated tools.
    api: composio:toolkits-api
    operationRef: openapi/composio-openapi-original.yml#/paths/~1toolkits~1{toolkitSlug}/get
    inputs:
      - toolkitSlug
    outputs:
      - toolkit
      - tools
