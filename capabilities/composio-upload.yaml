naftiko: 1.0.0-alpha2
info:
  label: Composio Platform API — Upload
  description: 'Composio Platform API — Upload. 1 operations. Lead operation: Create presigned URL for request file upload
    to S3. Self-contained Naftiko capability covering one Composio business surface.'
  tags:
  - Composio
  - Upload
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMPOSIO_API_KEY: COMPOSIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: composio-upload
    baseUri: https://backend.composio.dev
    description: Composio Platform API — Upload business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-files-upload-request
      path: /api/v3/files/upload/request
      operations:
      - name: postfilesuploadrequest
        method: POST
        description: Create presigned URL for request file upload to S3
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.COMPOSIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: composio-upload-rest
    port: 8080
    description: REST adapter for Composio Platform API — Upload. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/files/upload/request
      name: api-v3-files-upload-request
      description: REST surface for api-v3-files-upload-request.
      operations:
      - method: POST
        name: postfilesuploadrequest
        description: Create presigned URL for request file upload to S3
        call: composio-upload.postfilesuploadrequest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: composio-upload-mcp
    port: 9090
    transport: http
    description: MCP adapter for Composio Platform API — Upload. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-presigned-url-request-file
      description: Create presigned URL for request file upload to S3
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: composio-upload.postfilesuploadrequest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
