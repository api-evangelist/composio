naftiko: 1.0.0-alpha2
info:
  label: Composio Platform API — API Keys
  description: 'Composio Platform API — API Keys. 1 operations. Lead operation: Delete and generate new API key for project.
    Self-contained Naftiko capability covering one Composio business surface.'
  tags:
  - Composio
  - API Keys
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMPOSIO_API_KEY: COMPOSIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: composio-api-keys
    baseUri: https://backend.composio.dev
    description: Composio Platform API — API Keys business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-org-owner-project-nano_id-regenerate_api_key
      path: /api/v3/org/owner/project/{nano_id}/regenerate_api_key
      operations:
      - name: postorgownerprojectbynanoidregenerateapikey
        method: POST
        description: Delete and generate new API key for project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nano_id
          in: path
          type: string
          description: Unique identifier (Nano ID) of the project to regenerate API key for
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.COMPOSIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: composio-api-keys-rest
    port: 8080
    description: REST adapter for Composio Platform API — API Keys. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/org/owner/project/{nano-id}/regenerate-api-key
      name: api-v3-org-owner-project-nano-id-regenerate-api-key
      description: REST surface for api-v3-org-owner-project-nano_id-regenerate_api_key.
      operations:
      - method: POST
        name: postorgownerprojectbynanoidregenerateapikey
        description: Delete and generate new API key for project
        call: composio-api-keys.postorgownerprojectbynanoidregenerateapikey
        with:
          nano_id: rest.nano_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: composio-api-keys-mcp
    port: 9090
    transport: http
    description: MCP adapter for Composio Platform API — API Keys. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: delete-and-generate-new-api
      description: Delete and generate new API key for project
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: composio-api-keys.postorgownerprojectbynanoidregenerateapikey
      with:
        nano_id: tools.nano_id
      outputParameters:
      - type: object
        mapping: $.
