naftiko: 1.0.0-alpha2
info:
  label: Composio Platform API — CLI Authentication
  description: 'Composio Platform API — CLI Authentication. 2 operations. Lead operation: Create a new CLI session with auth
    code. Self-contained Naftiko capability covering one Composio business surface.'
  tags:
  - Composio
  - CLI Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMPOSIO_API_KEY: COMPOSIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: composio-cli-authentication
    baseUri: https://backend.composio.dev
    description: Composio Platform API — CLI Authentication business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-cli-create-session
      path: /api/v3/cli/create-session
      operations:
      - name: postclicreatesession
        method: POST
        description: Create a new CLI session with auth code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: api-v3-cli-get-session
      path: /api/v3/cli/get-session
      operations:
      - name: getcligetsession
        method: GET
        description: Get CLI session details by ID or code
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: query
          type: string
          description: CLI session ID (UUID format) or 6-character code to check. Both formats are supported for flexibility
            in client implementations.
          required: true
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.COMPOSIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: composio-cli-authentication-rest
    port: 8080
    description: REST adapter for Composio Platform API — CLI Authentication. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/v3/cli/create-session
      name: api-v3-cli-create-session
      description: REST surface for api-v3-cli-create-session.
      operations:
      - method: POST
        name: postclicreatesession
        description: Create a new CLI session with auth code
        call: composio-cli-authentication.postclicreatesession
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v3/cli/get-session
      name: api-v3-cli-get-session
      description: REST surface for api-v3-cli-get-session.
      operations:
      - method: GET
        name: getcligetsession
        description: Get CLI session details by ID or code
        call: composio-cli-authentication.getcligetsession
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: composio-cli-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Composio Platform API — CLI Authentication. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: create-new-cli-session-auth
      description: Create a new CLI session with auth code
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: composio-cli-authentication.postclicreatesession
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cli-session-details-id
      description: Get CLI session details by ID or code
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: composio-cli-authentication.getcligetsession
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
