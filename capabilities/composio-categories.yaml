naftiko: 1.0.0-alpha2
info:
  label: Composio Platform API — Categories
  description: 'Composio Platform API — Categories. 1 operations. Lead operation: List toolkit categories. Self-contained
    Naftiko capability covering one Composio business surface.'
  tags:
  - Composio
  - Categories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMPOSIO_API_KEY: COMPOSIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: composio-categories
    baseUri: https://backend.composio.dev
    description: Composio Platform API — Categories business capability. Self-contained, no shared references.
    resources:
    - name: api-v3-toolkits-categories
      path: /api/v3/toolkits/categories
      operations:
      - name: gettoolkitscategories
        method: GET
        description: List toolkit categories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: x-api-key
      value: '{{env.COMPOSIO_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: composio-categories-rest
    port: 8080
    description: REST adapter for Composio Platform API — Categories. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v3/toolkits/categories
      name: api-v3-toolkits-categories
      description: REST surface for api-v3-toolkits-categories.
      operations:
      - method: GET
        name: gettoolkitscategories
        description: List toolkit categories
        call: composio-categories.gettoolkitscategories
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: composio-categories-mcp
    port: 9090
    transport: http
    description: MCP adapter for Composio Platform API — Categories. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-toolkit-categories
      description: List toolkit categories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: composio-categories.gettoolkitscategories
      outputParameters:
      - type: object
        mapping: $.
