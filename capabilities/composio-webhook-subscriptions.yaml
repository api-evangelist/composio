        idempotent: true
      call: composio-webhook-subscriptions.patchwebhooksubscriptionsbyid
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-webhook-subscription
      description: Delete webhook subscription
      hints:
