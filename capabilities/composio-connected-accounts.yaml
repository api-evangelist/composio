      path: /api/v3/connected_accounts/link
      operations:
      - name: postconnectedaccountslink
        method: POST
        description: Create a new auth link session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
