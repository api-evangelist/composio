billingModel:
  pricingCategory: Tiered Subscription + Pay-As-You-Go
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
focusColumns:
  ServiceName: Composio
  ServiceCategory: AI Tooling / Integrations
  ProviderName: Composio
  PublisherName: Composio Inc.
  InvoiceIssuerName: Composio Inc.
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingUnit: tool_call
meters:
  - name: tool_calls
    description: Count of billable tool-call invocations executed through Composio
    unit: tool_call
    aggregation: sum
    dimensions:
      - tier
      - toolkit
      - account
      - environment
  - name: subscription_seat
    description: Monthly subscription per account/workspace
    unit: month
    aggregation: max
    dimensions:
      - tier
      - account
  - name: tool_call_overage
    description: Tool calls exceeding the included monthly quota, billed per 1,000
    unit: tool_calls_per_1000
    aggregation: sum
    dimensions:
      - tier
      - account
principles:
  - name: Visibility
    description: Use the Composio dashboard's usage views to track tool-call consumption per workspace
      and toolkit; export usage to internal data warehouses for unified FinOps reporting.
  - name: Allocation
    description: Tag tool calls by Composio entity ID (the per-end-user identifier) and toolkit so consumption
      can be attributed to consuming team, product, or end-customer.
  - name: Optimization
    description: Reduce per-tool-call cost by caching deterministic tool outputs, batching agent steps,
      using the Tool Router to short-circuit unnecessary calls, and right-sizing the subscription tier
      against included quota.
  - name: Accountability
    description: Set quota alerts before the included tool-call ceiling is reached on Starter and Professional
      to control overage spend; assign workspace owners as budget holders.
maintainers:
